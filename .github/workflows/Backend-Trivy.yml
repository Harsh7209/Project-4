name: Build and Scan Backend  Image

on:
  workflow_dispatch:
   

jobs:
  build-and-scan_backend_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t harsh9308/skillpulse-backend:${{ github.sha }} -f ./backend/Dockerfile

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'harsh9308/skillpulse-backend:${{ github.sha }}'
          format: 'table'
          exit-code: '1' 
          severity: 'CRITICAL,HIGH'
