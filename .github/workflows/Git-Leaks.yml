name: GitLeak Scan 
on:
    push:
jobs:
    Leak-check:
        runs-on: ubuntu-latest
        steps: 
            - name: code-checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Leak-check
              uses: gitleaks/gitleaks-action@v2
              env:
               GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}